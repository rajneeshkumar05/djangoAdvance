{% extends 'blog/base.html' %}
{% block content %}
<h2>{{post.title}}</h2>
<p>{{post.content}}</p>
<a href="{% url 'post_list' %}" class="btn btn-secondary">Back to all posts</a>
<a href="{% url 'post_edit' post.pk %}" class="btn btn-primary">Edit Post</a>
<a href="{% url 'post_delete' post.pk %}" class="btn btn-danger">Delete Post</a>
{% endblock %}
