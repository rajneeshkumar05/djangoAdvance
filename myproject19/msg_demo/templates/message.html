<!DOCTYPE html>
<html>
    <head>
        <title>
            All Msg data
        </title>
    </head>
    <h1>All message data</h1>
    {% if messages %}
    <ul>
        {% for message in messages %}
        <li>{{message}}</li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No messages</p>
    {% endif %}
</html>
